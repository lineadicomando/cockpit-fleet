# The test VMs of cockpit-fleet: names, addresses and sizes, the same for
# anyone who clones the repository. Sourced by env.sh before .env, which may
# override any of these (a free subnet, another pool) and holds what belongs
# to one workstation: the password and the path of the Windows ISO.

LAB_PREFIX=cockpit-fleet                # every VM, volume and network of the lab
LAB_NET=cockpit-fleet                   # libvirt NAT network of its own
LAB_BRIDGE=virbr-cfleet
LAB_SUBNET=192.168.140                  # /24; .1 is the gateway and DNS
LAB_POOL=default                        # libvirt pool for disks and media
LAB_USER=maint                          # admin account on every VM (sudo with password)
LAB_CACHE=$HOME/.cache/cockpit-fleet-vm # downloaded cloud images
# Not UTC on purpose: the containers of ct-test run in UTC, and a zone with
# an offset has found bugs they could not.
LAB_TIMEZONE=Europe/Rome
WIN_TIMEZONE="W. Europe Standard Time"
# Language of the Windows ISO (Setup refuses another) and keyboard layout.
WIN_LANG=en-US
WIN_KEYBOARD=0409:00000409

# Targets: short name -> VM, host part of the address, MAC, osinfo, vCPUs,
# memory in MiB, disk in GiB.
LAB_TARGETS="deb13 fed44 alma10 win11"
LAB_LINUX="deb13 fed44 alma10"
#          name                  ip  mac                osinfo       cpu mem   disk
LAB_deb13="cockpit-fleet-deb13   10  52:54:00:cf:14:10  debian13     2   2048  30"
LAB_fed44="cockpit-fleet-fed44   11  52:54:00:cf:14:11  linux2024    2   2048  30"
LAB_alma10="cockpit-fleet-alma10 12  52:54:00:cf:14:12  almalinux10  2   2048  30"
LAB_win11="cockpit-fleet-win11   20  52:54:00:cf:14:20  win11        2   4096  64"

# Cloud images (cloud-init) and the checksum files they are verified against.
IMG_deb13=https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
SUMS_deb13=https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
IMG_fed44=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
SUMS_fed44=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-44-1.7-x86_64-CHECKSUM
IMG_alma10=https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
SUMS_alma10=https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
