# cockpit-fleet: limits set by the administrator of this machine.
# Every value shown is the default. An unknown key is an error.

[runs]
# Runs executing at the same time; further runs wait in the queue.
#max_concurrent = 4
# Hosts Ansible works on in parallel within one run.
#default_forks = 5
# Upper bound a job template may ask for.
#max_forks = 50

[projects]
# Directories of this machine that may be used as a project as they are.
# Empty means that local-directory projects are disabled.
#local_roots = ["/srv/ansible"]
# Largest archive that can be uploaded as a project, in MB (at most 50).
#max_upload_mb = 20

[network]
# Proxy for outgoing connections (git, ansible-galaxy, notifications).
#proxy = "http://proxy.example.org:3128"

[adhoc]
# Modules an administrator may run as an ad-hoc command, by their full name.
# An empty list disables ad-hoc commands.
#modules = [
#    "ansible.builtin.ping", "ansible.builtin.setup", "ansible.builtin.command",
#    "ansible.builtin.shell", "ansible.builtin.service_facts",
#    "ansible.builtin.package_facts", "ansible.windows.win_ping",
#    "ansible.windows.setup", "ansible.windows.win_command",
#    "ansible.windows.win_shell", "ansible.windows.win_powershell",
#]
