# cockpit-fleet: limits set by the administrator of this machine.
# Every value shown is the default. An unknown key is an error.

[runs]
# Runs executing at the same time; further runs wait in the queue.
#max_concurrent = 4
# Hosts Ansible works on in parallel within one run.
#default_forks = 5
# Upper bound a job template may ask for.
#max_forks = 50

[projects]
# Directories of this machine that may be used as a project as they are.
# Empty means that local-directory projects are disabled.
#local_roots = ["/srv/ansible"]
# Largest archive that can be uploaded as a project, in MB (at most 50).
#max_upload_mb = 20

[network]
# Proxy for outgoing connections (git, ansible-galaxy, notifications).
#proxy = "http://proxy.example.org:3128"

[adhoc]
# Modules an administrator may run as an ad-hoc command, by their full name.
# An empty list disables ad-hoc commands.
#modules = [
#    "ansible.builtin.ping", "ansible.builtin.setup", "ansible.builtin.command",
#    "ansible.builtin.shell", "ansible.builtin.service_facts",
#    "ansible.builtin.package_facts", "ansible.windows.win_ping",
#    "ansible.windows.setup", "ansible.windows.win_command",
#    "ansible.windows.win_shell", "ansible.windows.win_powershell",
#]

[inventories]
# Let an executable file of a project be run as an inventory script. Off: a
# project's inventory is then only read, by the plugins that take a file.
#scripts = false

[mcp]
# Let agents reach the backend through fleet-mcp, as the user who starts it.
# An agent never gets more than that user's role, nor more than max_role
# (viewer, operator or admin). The output of a run is written by the nodes:
# an agent that reads it and may also change things can be steered by it.
#enabled = false
#max_role = "operator"

[chat]
# The chat page starts an agent as the user who opens it and gives it the
# tools of fleet-mcp, so it needs [mcp] enabled and stays under its max_role.
# It is off until an agent is named below. Naming one is a choice to make
# knowingly: what is typed in the chat, and what the tools answer (inventories,
# the outcome of runs, their output when asked), goes to the provider of the
# agent's model.
# An agent is a program that speaks the Agent Client Protocol on its standard
# input and output. Nothing here installs it: see docs/chat.md.
# Sessions open at the same time, for all users: one takes about 360 MB.
#max_sessions = 2
#[chat.agents.claude]
#command = ["/opt/cockpit-fleet-agent/node/bin/node",
#           "/opt/cockpit-fleet-agent/node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js"]
#label = "Claude"
# What a user runs in a terminal on this machine to log in to the model.
#login = "/opt/cockpit-fleet-agent/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude /login"
