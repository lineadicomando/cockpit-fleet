# cockpit-fleet: limits set by the administrator of this machine.
# Every value shown is the default. An unknown key is an error.

[runs]
# Runs executing at the same time; further runs wait in the queue.
#max_concurrent = 4
# Hosts Ansible works on in parallel within one run.
#default_forks = 5
# Upper bound a job template may ask for.
#max_forks = 50
# Days the output of a run is kept once it ended (its outcome stays); 0 keeps
# it for ever.
#keep_days = 90

[approvals]
# Hours a run of a template that needs approval waits for it before it
# expires; it then never starts.
#expire_hours = 24

[projects]
# Directories of this machine that may be used as a project as they are.
# Empty means that local-directory projects are disabled. How to make one
# that administrators write and the service reads: fleet(1), "Projects at a
# terminal". Not under /home, /root, /tmp or /var/tmp, which the scheduler
# does not see (bind-mount a project kept there, as fleet(1) says).
#local_roots = ["/srv/ansible"]
# Largest archive that can be uploaded as a project, in MB (at most 50).
#max_upload_mb = 20

[network]
# Proxy for outgoing connections (git, ansible-galaxy, notifications over
# HTTP; mail goes straight to its server).
#proxy = "http://proxy.example.org:3128"

[notifications]
# Where the web console is reached, for the links in the messages. Empty
# means https://<the name of this machine>:9090.
#url = "https://fleet.example.org:9090"

[checks]
# Check cycles running at the same time, apart from runs: a cycle does not
# wait behind a long playbook, nor a playbook behind the checks. Cycles of the
# slow kinds have as many of their own.
#max_concurrent = 1
# Hosts in one cycle, at most; more hosts due at once make more cycles.
# Fewer when the last cycles of the same checks say that this many would
# take more than half their interval.
#shard_size = 50
# Hosts Ansible works on in parallel within one cycle, at most. Fewer when
# the memory the last cycles took says that this many would not fit in
# memory_mb, shared by every cycle that may run at once.
#forks = 20
# Megabytes of memory that check cycles may take together; 0 is half of the
# controller's.
#memory_mb = 0
# Seconds the checks of one host may take before they are cut short.
#timeout = 60
# The same for the slow kinds (the CMDB, updates, compliance), which run in
# cycles of their own, apart from the other checks.
#slow_timeout = 900
# Hours after which a problem nobody acknowledged is told again; 0 never.
#reminder_hours = 24
# Due times a group of checks may skip in a row, because its cycles have not
# ended when they are due again, before it is said to fall behind: in the
# journal at every skip, to the rules that ask for it after this many.
#late_after = 3

[metrics]
# Days the values the checks measure are kept as they came, then as hourly
# and daily aggregates (lowest, highest, average). They must not decrease.
#raw_days = 14
#hourly_days = 90
#daily_days = 730

[adhoc]
# Modules an administrator may run as an ad-hoc command, by their full name.
# An empty list disables ad-hoc commands.
#modules = [
#    "ansible.builtin.ping", "ansible.builtin.setup", "ansible.builtin.command",
#    "ansible.builtin.shell", "ansible.builtin.service_facts",
#    "ansible.builtin.package_facts", "ansible.windows.win_ping",
#    "ansible.windows.setup", "ansible.windows.win_command",
#    "ansible.windows.win_shell", "ansible.windows.win_powershell",
#]

[inventories]
# Let an executable file of a project be run as an inventory script. Off, an
# executable file is read like any other. Not a line around code: a plugin
# file of a project still runs the plugin it names, which may come from the
# project's own collections; all of it in the sandbox of a run.
#scripts = false

[mcp]
# Let agents reach the backend through fleet-mcp, as the user who starts it.
# An agent never gets more than that user's role, nor more than max_role
# (viewer, operator or admin). The output of a run is written by the nodes:
# an agent that reads it and may also change things can be steered by it.
#enabled = false
#max_role = "operator"

[chat]
# The chat page starts an agent as the user who opens it and gives it the
# tools of fleet-mcp, so it needs [mcp] enabled and stays under its max_role.
# It is off until an agent is named below. Naming one is a choice to make
# knowingly: what is typed in the chat, and what the tools answer (inventories,
# the outcome of runs, their output when asked), goes to the provider of the
# agent's model.
# An agent is a program that speaks the Agent Client Protocol on its standard
# input and output. The package does not install one: for the adapter for
# Claude there is a playbook to run once, which can also write the section
# below (see docs/chat.md):
#   sudo env ANSIBLE_COLLECTIONS_PATH=/usr/share/cockpit-fleet/collections \
#       ansible-playbook -i localhost, -c local lineadicomando.fleet.chat_agent
# Sessions open at the same time, for all users: one takes about 360 MB.
#max_sessions = 2
#[chat.agents.claude]
#command = ["/opt/cockpit-fleet-agent/bin/claude-agent-acp"]
#label = "Claude"
# What a user runs in a terminal on this machine to log in to the model.
#login = "/opt/cockpit-fleet-agent/bin/claude /login"
