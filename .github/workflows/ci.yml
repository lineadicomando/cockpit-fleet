name: CI

on:
  push:
    branches:
      - main
    # A release tag, pushed to GitHub by Gitea's mirror, publishes the
    # packages it builds as a GitHub release (the job "release").
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z to build and publish (a release made before this job existed); empty for a plain run"
        required: false
        default: ""

concurrency:
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  RUFF_VERSION: "0.16.10"
  # Where scripts/ci-tool.sh keeps Node.js and ruff: nothing persists between
  # runs here, unlike the runners of .gitea/workflows/ci.yml.
  CI_TOOLS: /tmp/ci-tools

jobs:
  ci:
    # The same steps as the Gitea workflow, in a Debian 13 container: the
    # tests, lint and the .deb, checked by lintian.
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install the build tools of Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper lintian git ca-certificates curl xz-utils \
            make python3 python3-venv
          rm -rf /var/lib/apt/lists/*

      # The tags too: the packages take their version from git describe.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js and ruff
        run: |
          scripts/ci-tool.sh node "$NODE_VERSION" >> "$GITHUB_PATH"
          scripts/ci-tool.sh ruff "$RUFF_VERSION" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          node --version
          npm --version
          python3 --version
          ruff --version
          lintian --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Lint backend
        run: ruff check --no-cache backend collection

      - name: Backend tests
        run: make check-py

      - name: Build and check the .deb
        run: scripts/build-deb.sh --native

      - name: Keep the .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: deb/*.deb

  rpm:
    # The .rpm for Fedora 44 and AlmaLinux 10, each in a container of its
    # distribution, checked by rpmlint (from EPEL on AlmaLinux).
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
          - distro: alma
            image: almalinux:10
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      - name: Install the build tools of ${{ matrix.distro }}
        run: |
          if [ "${{ matrix.distro }}" = alma ]; then dnf install -y epel-release; fi
          dnf install -y rpm-build make systemd-rpm-macros rpmlint git curl xz tar
          dnf clean all

      # The tags too: the packages take their version from git describe.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        run: scripts/ci-tool.sh node "$NODE_VERSION" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          grep PRETTY_NAME /etc/os-release
          node --version
          rpmbuild --version
          rpmlint --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build and check the .rpm
        run: scripts/build-rpm.sh --native

      - name: Keep the .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.distro }}
          path: rpm/*.rpm

  release:
    # At a release tag, the packages built above become the assets of the
    # GitHub release of that tag, with its section of CHANGELOG.md as notes.
    # Run again, it replaces the assets and keeps the release.
    needs: [ci, rpm]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The tag itself, or main for a tag published by hand: the notes of an
      # earlier release are in main's CHANGELOG.md too.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Check the tag
        if: github.event_name == 'push'
        run: node scripts/release.mjs verify "$TAG"

      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A package built away from the tag would carry a version of
      # scripts/version.sh (0.2.0+3.gabc1234): only X.Y.Z itself is published.
      - name: Check the packages and sum them
        run: |
          version="${TAG#v}"
          cd dist
          ls -l
          test -f "cockpit-fleet_${version}_all.deb"
          test -f "cockpit-fleet-${version}-1.fc44.noarch.rpm"
          test -f "cockpit-fleet-${version}-1.el10.noarch.rpm"
          test "$(ls | wc -l)" -eq 3
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        run: |
          # Links relative to the repository, such as docs/install.md, point
          # at the files of the tag.
          node scripts/release.mjs notes "${TAG#v}" \
            | sed -E "s#\]\((docs/|CHANGELOG|README)#](https://github.com/${GH_REPO}/blob/${TAG}/\1#g" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "cockpit-fleet ${TAG#v}" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "cockpit-fleet ${TAG#v}" --notes-file notes.md
          fi
