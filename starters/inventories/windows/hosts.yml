---
# The hosts, by group. A host takes the variables of the groups it is in,
# from group_vars/GROUP.yml, and its own from host_vars/HOST.yml.
all:
  children:
    windows:
      hosts:
        # One per line, with the address if the name does not resolve:
        # pc01.example.com:
        # pc02:
        #   ansible_host: 192.0.2.20
