name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  RUFF_VERSION: "0.16.10"

jobs:
  ci:
    # Debian 13 runner without deploy mounts; the job runs in its container.
    runs-on: cockpit-fleet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tools with a version are not in the runner image: the version is pinned
      # here and the files stay in /data/tools (persistent), one directory each.
      - name: Setup Node.js and ruff
        run: |
          scripts/ci-tool.sh node "$NODE_VERSION" >> "$GITHUB_PATH"
          scripts/ci-tool.sh ruff "$RUFF_VERSION" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          node --version
          npm --version
          python3 --version
          ruff --version
          lintian --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Lint backend
        run: ruff check --no-cache backend collection

      - name: Backend tests
        run: make check-py

      - name: Build and check the .deb
        run: scripts/build-deb.sh --native

  rpm:
    # One runner per distribution, Fedora 44 and AlmaLinux 10, with rpm-build
    # and rpmlint; the job runs in its container, as the one above.
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, alma]
    runs-on: cockpit-fleet-${{ matrix.distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        run: scripts/ci-tool.sh node "$NODE_VERSION" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          cat /etc/os-release | grep PRETTY_NAME
          node --version
          rpmbuild --version
          rpmlint --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build and check the .rpm
        run: scripts/build-rpm.sh --native
