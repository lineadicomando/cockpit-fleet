name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  RUFF_VERSION: "0.16.10"

jobs:
  ci:
    # Debian 13 runner without deploy mounts; the job runs in its container.
    runs-on: cockpit-fleet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tools with a version are not in the runner image: the version is pinned
      # here and the files stay in /data/tools (persistent), one directory each.
      - name: Setup Node.js
        shell: bash
        run: |
          set -euo pipefail
          dir="/data/tools/node/${NODE_VERSION}"
          if [ ! -x "$dir/bin/node" ]; then
            case "$(uname -m)" in
              x86_64) arch="linux-x64" ;;
              aarch64) arch="linux-arm64" ;;
              *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
            esac
            file="node-v${NODE_VERSION}-${arch}.tar.xz"
            url="https://nodejs.org/dist/v${NODE_VERSION}"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/$file" "$url/$file"
            curl -fsSL -o "$tmp/SHASUMS256.txt" "$url/SHASUMS256.txt"
            (cd "$tmp" && grep " $file\$" SHASUMS256.txt | sha256sum -c)
            mkdir -p "$dir"
            tar -xJf "$tmp/$file" -C "$dir" --strip-components=1
            rm -rf "$tmp"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Setup ruff
        shell: bash
        run: |
          set -euo pipefail
          dir="/data/tools/ruff/${RUFF_VERSION}"
          if [ ! -x "$dir/bin/ruff" ]; then
            python3 -m venv "$dir"
            "$dir/bin/pip" install --quiet "ruff==${RUFF_VERSION}"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          node --version
          npm --version
          python3 --version
          ruff --version
          lintian --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Lint backend
        run: ruff check --no-cache backend collection

      - name: Backend tests
        run: make check-py

      - name: Build and check the .deb
        run: scripts/build-deb.sh --native
